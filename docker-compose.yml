services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reporeader-postgres
    environment:
      POSTGRES_DB: reporeader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD : pass
    ports:
      - "5433:5432"
    volumes:
      - reporeader_pg_data:/var/lib/postgres/data 
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U reporeader",]
      interval: 5s
      timeout: 50s
      retries: 5
      start_period: 30s
volumes:
  reporeader_pg_data: